[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Discovery -> capability artifact -> deterministic replay automation system for legacy back-office UIs (interface.ai take-home)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    # Added in Phase 3: PlaywrightWebSurface is the concrete SurfaceAdapter
    # that Section 3.1 requires actually drive a live UI. It is imported
    # ONLY by cua.surfaces.playwright_web -- see tests/test_replay_model_isolation.py
    # for the automated proof that cua.replay never touches it either.
    "playwright>=1.47,<2",
]

# NOTE: fastapi/uvicorn and the anthropic SDK are intentionally NOT listed
# yet. Each dependency should earn its place; they are added in the
# pyproject update that ships the phase that actually imports them
# (FastAPI/uvicorn -> Phase 5 handoff console + Phase 6 demo app, anthropic
# -> Phase 4 discovery). See REPORT.md "Cuts" for the full dependency log.

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    # Needed to run this codebase's async test suite (ReplayEngine and
    # SurfaceAdapter are asyncio-native) without hand-rolling asyncio.run()
    # wrappers in every test file.
    "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# auto: async def test functions run as tests without needing an explicit
# @pytest.mark.asyncio on each one.
asyncio_mode = "auto"
