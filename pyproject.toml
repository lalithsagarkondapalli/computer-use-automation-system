[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Discovery -> capability artifact -> deterministic replay automation system for legacy back-office UIs (interface.ai take-home)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    # Added in Phase 3: PlaywrightWebSurface is the concrete SurfaceAdapter
    # that Section 3.1 requires actually drive a live UI. It is imported
    # ONLY by cua.surfaces.playwright_web -- see tests/test_replay_model_isolation.py
    # for the automated proof that cua.replay never touches it either.
    "playwright>=1.47,<2",
    # Added in Phase 4: AnthropicModelAdapter (src/cua/models/anthropic_adapter.py)
    # is the ONLY module in the repository that imports this SDK -- every
    # other module reaches the model only through the provider-neutral
    # ModelAdapter interface (src/cua/models/base.py). See
    # tests/test_discovery_replay_isolation.py for the automated proof
    # that cua.replay still never imports this package.
    "anthropic>=0.40,<1",
    # Added in Phase 6: cua.demo_app is the local "legacy credit union back
    # office" target the automation system operates on -- FastAPI/Jinja2
    # for the server-rendered app, uvicorn to run it (including as a real
    # subprocess in tests/test_demo_app_e2e.py). Phase 5's OperatorConsole
    # deliberately does NOT use these -- stdlib http.server was sufficient
    # there; this is the one place in the repo these are actually needed.
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    # Needed to run this codebase's async test suite (ReplayEngine and
    # SurfaceAdapter are asyncio-native) without hand-rolling asyncio.run()
    # wrappers in every test file.
    "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# auto: async def test functions run as tests without needing an explicit
# @pytest.mark.asyncio on each one.
asyncio_mode = "auto"
